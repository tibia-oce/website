name: Commit Linting

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "admin/**"
      - "docker/**"
      - "plugins/**"
      - "images/**"
      - "system/**"
      - "templates/**"
      - "tools/**"
      - "xml/**"
  push:
    branches:
      - master
      - develop
    paths:
      - "admin/**"
      - "docker/**"
      - "plugins/**"
      - "images/**"
      - "system/**"
      - "templates/**"
      - "tools/**"
      - "xml/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: wagoid/commitlint-github-action@v6
